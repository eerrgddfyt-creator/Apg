buy:()=>{const t=UI.tab,i=UI.sel[t]==null?Save.d.eq[t]:UI.sel[t],p=CAT[t][i][2];if(Save.d.coins<p){toast('Faltam ◆ '+(p-Save.d.coins)+' moedas. Jogue partidas para ganhar mais!');return}Save.d.coins-=p;Save.d.own[t].push(i);Save.d.eq[t]=i;Save.save();toast('Comprado e equipado!');go('shop')},
eq:()=>{const t=UI.tab,i=UI.sel[t]==null?Save.d.eq[t]:UI.sel[t];Save.d.eq[t]=i;Save.save();toast('Equipado!');go('shop')},
hed:()=>{UI.edFrom='set';hideUI();HUD.edit(true)},hud:()=>{UI.edFrom='pause';hideUI();HUD.edit(true)},
resume:()=>{hideUI();G.pz(false)},quit:()=>{Net.close();G.stop();Snd.music(true);go('home')},
rback:()=>{if(Net.role==='host'){tidy();lbSend()}go('lobby')}};
UI.pause=()=>{if(gs!=='play')return;if(G.mode==='off')G.pz(true);go('pause')};
UI.edDone=()=>go(UI.edFrom);
const lockL=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
const fsGo=()=>{lockL();try{const d=document.documentElement;d.requestFullscreen&&d.requestFullscreen({navigationUI:'hide'}).then(lockL).catch(()=>{})}catch(e){}};
U.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(mob&&!UI.fs){UI.fs=1;fsGo()}Snd.init();if(gs!=='play'&&gs!=='pause')Snd.music(true);tone(520,470,.07,'triangle',.22);const f=ACT[b.dataset.a];if(f)f(b)});
U.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(k){Save.d[k]=+t.value;Save.save();Snd.vol();if(k==='ho')applyHo()}else if(t.id==='nm'){Save.d.name=t.value.slice(0,12)||'Jogador';Save.save()}});
addEventListener('keydown',e=>{if(e.code!=='Escape')return;if(HUD.ed)HUD.edit(false);else if(uiOpen())ACT.back();else if(gs==='play')UI.pause()});
addEventListener('popstate',()=>{if(HUD.ed)HUD.edit(false);else if(uiOpen()){if(UI.cur!=='home')ACT.back()}else if(gs==='play')UI.pause()});
addEventListener('resize',()=>{if(innerHeight>innerWidth&&gs==='play'&&G.mode==='off')UI.pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&gs==='play'&&G.mode==='off')UI.pause();if(Snd.c)document.hidden?Snd.c.suspend():Snd.c.resume()});
G.onEnd=r=>{const earn=r.kills*10+(r.win?100:20),s=Save.d.st;s.g++;if(r.win)s.w++;s.k+=r.kills;Save.d.coins+=earn;Save.save();UI.res={...r,earn};go('res');Snd.music(true)};
function applyHo(){document.documentElement.style.setProperty('--ho',Save.d.ho)}
function boot(){try{localStorage.setItem('apagaoTry',0)}catch(e){}const l=$('load');if(l){l.classList.add('gone');setTimeout(()=>l.remove(),700)}}
HUD.build();applyHo();go('home');
if(!Save.d.tut){UI.pg=0;go('how')}else if(Save.d.ver!==GAME_V)go('news');


</script></body></html>

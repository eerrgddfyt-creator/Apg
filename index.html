/* Online ponto a ponto (WebRTC via PeerJS): o código da sala é o ID do anfitrião. */
const Net={p:null,cs:[],c:null,code:'',role:'',h:{},
mkCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.random()*a.length|0];return s},
host(ok,err,n){if(!window.Peer){err('Sem conexão com o servidor de salas');return}const code=this.mkCode(),p=this.p=new Peer('apagao-'+code);
p.on('open',()=>{this.code=code;this.role='host';ok()});
p.on('error',e=>{if(e.type==='unavailable-id'&&(n||0)<5){this.close();this.host(ok,err,(n||0)+1)}else{this.close();err('Falha ao criar a sala')}});
p.on('connection',c=>{c.on('open',()=>this.cs.push(c));c.on('data',m=>this.h.msg&&this.h.msg(c,m));c.on('close',()=>{this.cs=this.cs.filter(x=>x!==c);this.h.leave&&this.h.leave(c)})})},
join(code,ok,err){if(!window.Peer){err('Sem conexão com o servidor de salas');return}code=code.toUpperCase();const p=this.p=new Peer();let done=0;const fail=m=>{if(!done){done=1;this.close();err(m)}};
p.on('open',()=>{const c=this.c=p.connect('apagao-'+code,{reliable:true});const to=setTimeout(()=>fail('Sala não encontrada'),9000);
c.on('open',()=>{clearTimeout(to);done=1;this.role='client';this.code=code;ok()});c.on('data',m=>this.h.msg&&this.h.msg(c,m));c.on('close',()=>{if(done)this.h.leave&&this.h.leave(c)})});
p.on('error',()=>fail('Sala não encontrada'))},
send(m){if(this.role==='client'&&this.c&&this.c.open)this.c.send(m)},
all(m){for(const c of this.cs)if(c.open)c.send(m)},
close(){try{this.p&&this.p.destroy()}catch(e){}this.p=null;this.cs=[];this.c=null;this.role=''}};

shop:()=>{const t=UI.tab,L=CAT[t],i=UI.sel[t]==null?Save.d.eq[t]:UI.sel[t],it=L[i],own=Save.d.own[t].includes(i),eq=Save.d.eq[t]===i;
return pgx('Loja',`<div class="row">${Object.keys(TABS).map(k=>`<button class="tb${k===t?' on':''}" data-a="tab" data-v="${k}">${TABS[k]}</button>`).join('')}</div><div class="shop"><div class="grid">${L.map((x,j)=>`<button class="card${j===i?' on':''}" data-a="pick" data-v="${j}">${ICO[t](hx(x[1]))}<b>${x[0]}</b><small>${Save.d.eq[t]===j?'Em uso':Save.d.own[t].includes(j)?'Seu':'◆ '+x[2]}</small></button>`).join('')}</div><div class="det"><div class="pv">${ICO[t](hx(it[1]))}</div><h3>${it[0]}</h3><p class="hint">${DESC[t]}</p>${eq?'<button class="btn g" disabled>Em uso</button>':own?'<button class="btn" data-a="eq">Equipar</button>':`<button class="btn t" data-a="buy">Comprar ◆ ${it[2]}</button>`}</div></div><p class="hint">Ganhe moedas jogando: 10 por abate e 100 pela vitória.</p>`,`<span class="tag m">◆ ${Save.d.coins}</span>`)},
set:()=>{const d=Save.d,s=d.st;return pgx('Ajustes',`<div class="cols cols3"><div><h3>Controles</h3>${sg('fm','Mira e tiro',[['stick','Joystick'],['fixed','Botão fixo'],['drag','Arrastar']],{stick:'Joystick: arraste o dedo para mirar; atira quando você estica.',fixed:'Botão ATIRAR parado. Mira sozinho no inimigo mais próximo; ou arraste o lado direito para mirar.',drag:'A mira vai para onde seu dedo está no lado direito da tela.'})}${d.fm==='drag'?sg('dt','Atirar ao arrastar',[[1,'Sim'],[0,'Só no botão']],{1:'Atira enquanto seu dedo estiver na tela.',0:'Só o botão ATIRAR dispara; arrastar só mira (o laser mostra para onde).'}):''}${sg('sj','Joysticks',[['float','Flutuante'],['fixed','Fixo']],{float:'Aparecem onde você encosta o dedo.',fixed:'Ficam parados no lugar definido no Editor de HUD.'})}${sg('aa','Mira assistida (botão fixo)',[[1,'Ligada'],[0,'Desligada']],{1:'O tiro vira para o inimigo visível mais próximo.',0:'O tiro vai só para onde você apontou.'})}${sg('lh','Lado dos controles',[[0,'Destro'],[1,'Canhoto']],{0:'Mover à esquerda, atirar à direita.',1:'Layout espelhado.'})}<button class="btn g" data-a="hed">Editar HUD (posição e tamanho)</button></div><div><h3>Som</h3>${sl('vol','Volume geral',1)}${sl('sfx','Efeitos',1)}${sl('mus','Música',1)}<label class="sg"><b>Seu nome</b><input type="text" id="nm" maxlength="12" value="${esc(d.name)}"></label></div><div><h3>Imagem</h3>${sl('shake','Tremor de câmera',1.5)}${sl('ho','Opacidade dos botões',1,.3)}${sg('q','Qualidade gráfica',[[0,'Baixa'],[1,'Média'],[2,'Alta']],{0:'Mais fluido em aparelhos fracos.',1:'Equilibrado.',2:'Mais nítido; gasta mais bateria.'})}<div class="row"><button class="btn g sm" data-a="how">Como jogar</button><button class="btn g sm" data-a="news">Novidades</button></div><p class="hint">Partidas ${s.g} · Vitórias ${s.w} · Abates ${s.k}<br>Versão ${GAME_V}${otaMsg()}</p></div></div>`)},
how:()=>{const p=HOW[UI.pg],L=UI.pg===HOW.length-1;return `<button class="btn g sm sk" data-a="back">Pular</button><div class="tut"><div class="tv">${p[2]}</div><div class="tx"><small>${UI.pg+1} / ${HOW.length}</small><h2>${p[0]}</h2><p>${p[1]}</p><div class="row">${UI.pg?'<button class="btn g sm" data-a="hp">Anterior</button>':''}<button class="btn t" data-a="hn">${L?'Entendi!':'Próximo'}</button></div></div></div>`},
news:()=>pgx('Novidades da versão '+GAME_V,`<ul class="ls nv">${NOV.map(n=>`<li>${n}</li>`).join('')}</ul><button class="btn t" data-a="back">Entendi</button>`),
res:()=>{const r=UI.res,t=r.br?(r.win?'Vitória Suprema!':'Eliminado'):(r.win?'Vitória!':'Derrota'),d=r.br?(r.win?'Você foi o último sobrevivente.':'Você ficou em #'+r.place+' de '+r.total+'.'):(r.win?'Você dominou o escuro.':esc(r.w)+' chegou à meta de '+WIN+' abates.');return `<div class="pzc"><h2>${t}</h2><p>${d}</p><p>Seus abates: <b>${r.kills}</b> · Moedas ganhas: <b>◆ ${r.earn}</b></p>${Net.role?'<button class="btn t" data-a="rback">Voltar à sala</button>':'<button class="btn t" data-a="again">Jogar de novo</button><button class="btn g" data-a="home">Menu</button>'}</div>`},
pause:()=>`<div class="pzc"><h2>Pausado</h2><p class="hint">${G.mode==='off'?'O jogo está parado.':'Online: a partida continua rolando.'}</p><button class="btn t" data-a="resume">Continuar</button>${G.mode==='off'?'<button class="btn g" data-a="hud">Editar HUD</button>':''}<button class="btn g" data-a="quit">Sair para o menu</button></div>`};
function go(n){UI.cur=n;if(n==='home')UI.tip=TIPS[Math.random()*TIPS.length|0];U.className='on'+(n==='pause'?' ov cn':n==='res'?' cn':'');U.innerHTML=SC[n]();U.scrollTop=0;try{history.pushState(null,'')}catch(e){}}
const hideUI=()=>{U.className=''};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)};
function launch(cfg){UI.last=cfg;hideUI();Snd.music(false);try{history.pushState(null,'')}catch(e){}start(cfg)}
const mkSlots=n=>[{h:1,...me()}].concat(Array.from({length:n},()=>({h:0})));
const lbSend=()=>Net.all({t:'lb',p:UI.roster.map(r=>[r.n,r.s]),b:UI.lb.b});
function hostMsg(c,m){if(m.t==='hi'){if(m.v!==GAME_V){c.send({t:'ver',v:GAME_V});return}if(UI.roster.length>=5||gs==='play'){c.send({t:'full'});return}c.slot=UI.roster.length;UI.roster.push({n:esc(m.n||'Jogador').slice(0,12),s:m.s|0,l:m.l|0,g:m.g|0,c});lbSend();if(UI.cur==='lobby')go('lobby')}else G.rx(c,m)}
function hostLeave(c){const i=UI.roster.findIndex(r=>r.c===c);if(i<1)return;if(gs==='play'){G.drop(i);return}UI.roster.splice(i,1);UI.roster.forEach((r,j)=>{if(r.c)r.c.slot=j});lbSend();if(UI.cur==='lobby')go('lobby')}
function tidy(){UI.roster=UI.roster.filter((r,i)=>i===0||(r.c&&r.c.open));UI.roster.forEach((r,i)=>{if(r.c)r.c.slot=i})}
function hostGo(){tidy();const h=UI.roster,nb=Math.min(UI.lb.b,5-h.length),slots=h.map(r=>({h:1,n:r.n,s:r.s,l:r.l,g:r.g})).concat(Array.from({length:nb},()=>({h:0})));if(slots.length<2)slots.push({h:0});const w=Save.d.mw,d=Save.d.df;h.forEach((r,i)=>{if(r.c)r.c.send({t:'go',me:i,slots,win:w,df:d})});launch({mode:'host',me:0,slots,win:w,df:d})}
function cliMsg(c,m){const t=m.t;if(t==='lb'){UI.lb={p:m.p,b:m.b};if(UI.cur==='lobby')go('lobby')}else if(t==='go')launch({mode:'client',me:m.me,slots:m.slots,win:m.win,df:m.df});else if(t==='sn')G.snap(m.s);else if(t==='ev')m.e.forEach(e=>G.ev(e));else if(t==='full'||t==='ver'){Net.close();UI.msg=t==='ver'?'A sala usa a versão '+m.v+' e você a '+GAME_V+'. Atualize o jogo.':'Sala cheia ou partida em andamento.';go('online')}}
const ACT={home:()=>go('home'),modes:()=>go('modes'),solo:()=>go('solo'),brs:()=>go('brs'),playbr:()=>launch({mode:'off',me:0,slots:mkSlots(0),map:'br',bots:Save.d.bn,df:Save.d.df}),online:()=>{UI.msg='';go('online')},shop:()=>go('shop'),set:()=>go('set'),news:()=>go('news'),how:()=>{UI.pg=0;go('how')},
back:()=>{const c=UI.cur;if(c==='lobby'){Net.close();go('online')}else if(c==='pause')ACT.resume();else{if(c==='how'||c==='news'){Save.d.tut=1;Save.d.ver=GAME_V;Save.save()}go(PAR[c]||'home')}},
hp:()=>{if(UI.pg>0){UI.pg--;go('how')}},hn:()=>{if(UI.pg<HOW.length-1){UI.pg++;go('how')}else ACT.back()},
sv:b=>{const k=b.dataset.k,v=b.dataset.v;Save.d[k]=/^[\d.]+$/.test(v)?+v:v;Save.save();if(k==='lh')HUD.all();go(UI.cur)},
play:()=>launch({mode:'off',me:0,slots:mkSlots(Save.d.mb),df:Save.d.df,win:Save.d.mw}),again:()=>launch(UI.last),
mk:()=>{UI.msg='Criando sala…';go('online');Net.host(()=>{UI.roster=[{...me(),c:null}];UI.lb={p:[],b:2};Net.h.msg=hostMsg;Net.h.leave=hostLeave;go('lobby')},er=>{UI.msg=er;go('online')})},
jn:()=>{const c=($('cd').value||'').toUpperCase().trim();if(c.length<4){UI.msg='Digite o código da sala.';go('online');return}UI.msg='Entrando…';go('online');
Net.h.msg=cliMsg;Net.h.leave=()=>{Net.close();G.stop();UI.msg='A sala foi fechada.';go('online');Snd.music(true)};
Net.join(c,()=>{UI.lb={p:[],b:0};Net.send({t:'hi',...me()});go('lobby')},er=>{UI.msg=er;go('online')})},
bots:b=>{UI.lb.b=+b.dataset.v;lbSend();go('lobby')},begin:()=>hostGo(),
cp:()=>{try{navigator.clipboard.writeText(Net.code).then(()=>toast('Código copiado!')).catch(()=>toast('Código: '+Net.code))}catch(e){toast('Código: '+Net.code)}},
sh:()=>{try{navigator.share({title:'APAGÃO',text:'Entre na minha sala do APAGÃO! Código: '+Net.code}).catch(()=>{})}catch(e){toast('Seu aparelho não tem compartilhar')}},
tab:b=>{UI.tab=b.dataset.v;go('shop')},pick:b=>{UI.sel[UI.tab]=+b.dataset.v;go('shop')},
buy:()=>{const t=UI.tab,i=UI.sel[t]==null?Save.d.eq[t]:UI.sel[t],p=CAT[t][i][2];if(Save.d.coins<p){toast('Faltam ◆ '+(p-Save.d.coins)+' moedas. Jogue partidas para ganhar mais!');return}Save.d.coins-=p;Save.d.own[t].push(i);Save.d.eq[t]=i;Save.save();toast('Comprado e equipado!');go('shop')},
eq:()=>{const t=UI.tab,i=UI.sel[t]==null?Save.d.eq[t]:UI.sel[t];Save.d.eq[t]=i;Save.save();toast('Equipado!');go('shop')},
hed:()=>{UI.edFrom='set';hideUI();HUD.edit(true)},hud:()=>{UI.edFrom='pause';hideUI();HUD.edit(true)},
resume:()=>{hideUI();G.pz(false)},quit:()=>{Net.close();G.stop();Snd.music(true);go('home')},
rback:()=>{if(Net.role==='host'){tidy();lbSend()}go('lobby')}};
UI.pause=()=>{if(gs!=='play')return;resetIn();if(G.mode==='off')G.pz(true);go('pause')};
UI.edDone=()=>go(UI.edFrom);
const lockL=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
const fsGo=()=>{lockL();try{const d=document.documentElement;d.requestFullscreen&&d.requestFullscreen({navigationUI:'hide'}).then(lockL).catch(()=>{})}catch(e){}};
U.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(mob&&!UI.fs){UI.fs=1;fsGo()}Snd.init();if(gs!=='play'&&gs!=='pause')Snd.music(true);tone(520,470,.07,'triangle',.22);const f=ACT[b.dataset.a];if(f)f(b)});
U.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(k){Save.d[k]=+t.value;Save.save();Snd.vol();if(k==='ho')applyHo();if(k==='bn')$('bnv').textContent=t.value}else if(t.id==='nm'){Save.d.name=t.value.slice(0,12)||'Jogador';Save.save()}});
addEventListener('keydown',e=>{if(e.code!=='Escape')return;if(HUD.ed)HUD.edit(false);else if(uiOpen())ACT.back();else if(gs==='play')UI.pause()});
addEventListener('popstate',()=>{if(HUD.ed)HUD.edit(false);else if(uiOpen()){if(UI.cur!=='home')ACT.back()}else if(gs==='play')UI.pause()});
addEventListener('resize',()=>{if(innerHeight>innerWidth&&gs==='play'&&G.mode==='off')UI.pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&gs==='play'&&G.mode==='off')UI.pause();if(Snd.c)document.hidden?Snd.c.suspend():Snd.c.resume()});
G.onEnd=r=>{const s=Save.d.st;let earn;if(r.br){earn=r.kills*10+(r.win?200:r.place<=3?100:r.place<=10?40:10);if(!s.b||r.place<s.b)s.b=r.place}else earn=r.kills*10+(r.win?100:20);s.g++;if(r.win)s.w++;s.k+=r.kills;Save.d.coins+=earn;Save.save();UI.res={...r,earn};go('res');Snd.music(true)};
function applyHo(){document.documentElement.style.setProperty('--ho',Save.d.ho)}
function boot(){try{localStorage.setItem('apagaoTry',0)}catch(e){}const l=$('load');if(l){l.classList.add('gone');setTimeout(()=>l.remove(),700)}}
HUD.build();applyHo();go('home');
if(!Save.d.tut){UI.pg=0;go('how')}else if(Save.d.ver!==GAME_V)go('news');


</script></body></html>
